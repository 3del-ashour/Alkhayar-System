stages:
  - commit
  - quality
  - test
  - build
  - acceptance

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

before_script:
  - python -m pip install --upgrade pip
  - pip install -r requirements.txt

commit:
  stage: commit
  script:
    - echo "Commit stage placeholder"

lint:
  stage: quality
  script:
    - ruff check src serving scripts orchestration

unit_tests:
  stage: test
  script:
    - pytest -q

component_tests:
  stage: test
  script:
    - pytest -q tests/test_components.py

build_image:
  stage: build
  script:
    - docker build -t stockout-api -f docker/Dockerfile .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

acceptance:
  stage: acceptance
  script:
    - python scripts/run_pipeline.py
  allow_failure: true
